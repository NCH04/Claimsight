name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU wheels — no GPU on runners)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,api,dev]"

      - name: Lint
        run: ruff check claimsight/ tests/ scripts/ sanity_check.py

      # La logique métier — taxonomie, agrégation, déduplication, couverture,
      # attribution par pièce — est volontairement sans dépendance torch, donc
      # la suite tourne sans GPU, sans dataset et sans poids entraînés.
      - name: Tests
        run: pytest tests/ -q

      - name: Generated files are in sync with the taxonomy
        run: |
          python scripts/build_yolo_config.py --out /tmp/parts_yolo.yaml
          diff -u configs/parts_yolo.yaml /tmp/parts_yolo.yaml \
            || (echo "::error::configs/parts_yolo.yaml est désynchronisé — relancez scripts/build_yolo_config.py" && exit 1)
          python scripts/build_parts_spec.py --out /tmp/supported_parts_v1.md
          diff -u specs/supported_parts_v1.md /tmp/supported_parts_v1.md \
            || (echo "::error::specs/supported_parts_v1.md est désynchronisé — relancez scripts/build_parts_spec.py" && exit 1)
