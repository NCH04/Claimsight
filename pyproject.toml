[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsight"
version = "0.2.0"
description = "Automated vehicle damage assessment from claim photos: view classification, damage and severity grading, part detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nabil Chartouni" }]
keywords = ["computer-vision", "pytorch", "yolo", "insurance", "claims", "damage-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Dépendances du coeur: inférence + pipeline.
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/NCH04/Claimsight"
Repository = "https://github.com/NCH04/Claimsight"
Issues = "https://github.com/NCH04/Claimsight/issues"

[project.optional-dependencies]
# Entraînement des classifieurs (view / damage / severity).
train = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
]
# Détection de pièces.
yolo = [
    "ultralytics>=8.2",
]
# Annotation.
label = [
    "label-studio==1.21.0",
    "label-studio-sdk==2.0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
all = [
    "claimsight[train,yolo,label,dev]",
]

[project.scripts]
claimsight = "claimsight.pipeline.run_pipeline:main"
claimsight-train = "claimsight.training.train_classifier:main"
claimsight-train-parts = "claimsight.training.train_parts_yolo:main"

[tool.setuptools.packages.find]
include = ["claimsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
